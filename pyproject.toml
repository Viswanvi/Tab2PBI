[project]
name = "tab2pbi"
version = "0.1.0"
description = "Tableau to Power BI migration assessment and deterministic conversion orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
